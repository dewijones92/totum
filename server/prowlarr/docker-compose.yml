# Prowlarr — torrent/usenet indexer aggregator, for Totum's search.
#
# Its OWN compose project, like webproxy/, hermes/ and the crashlog server, rather than a
# service in the templated stack. Two reasons, both practical: the templated `bin/` can only be
# regenerated by generate.sh with an UNLOCKED Bitwarden vault (i.e. Dewi's master password, not
# automatable), and keeping this separate means restarting or upgrading it never touches nginx,
# gluetun or qBittorrent.
#
# It joins `bin_private` as an external network and publishes NO host port, so the only way in is
# through nginx — which gates it with oauth2-proxy against the authenticated-emails allowlist.
# Nothing here is reachable from the internet without Dewi's Google account.
#
# It does NOT share gluetun's netns. Prowlarr only queries indexer WEBSITES over HTTPS; it never
# touches a swarm, so it has no need of PureVPN, and putting it there would route its API calls
# through the same tunnel qBittorrent uses for peers to no benefit. The torrent traffic that DOES
# need the VPN is qBittorrent's, and that is already inside gluetun.
name: prowlarr

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - /var/lib/prowlarr/config:/config
    networks:
      - bin_private
    restart: always

networks:
  bin_private:
    external: true
