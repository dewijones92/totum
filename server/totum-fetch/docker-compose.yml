name: totum-fetch

services:
  totum-fetch:
    build:
      context: ../totum-cli
      target: fetch
      args:
        TOTUM_VERSION: ${TOTUM_VERSION:?set TOTUM_VERSION to the release to run, e.g. 0.1.800}
    image: totum-fetch:${TOTUM_VERSION}
    container_name: totum-fetch
    env_file:
      - /var/lib/totum-fetch/fetch.env
    environment:
      TZ: GMT0BST,M3.5.0/1,M10.5.0
    volumes:
      - /var/lib/totum-fetch/home:/home/totum
      - /home/pi/ext_files/media:/media
      - /run/user/1000/pulse/native:/run/pulse/native
      - /home/pi/.config/pulse/cookie:/run/pulse/cookie:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /var/lib/hermes-audio:/sounds:ro
    ports:
      - "127.0.0.1:8772:8772"
      - "8771:8771"
    networks:
      - bin_private
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8770/health"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  bin_private:
    external: true
