<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Totum screen</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.11.0/dist/shaka-player.compiled.js"></script>
<style>
  :root { --ink: #1a1c20; --soft: #565b64; --bg: #ffffff; --accent: #e8590c; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 18px/1.5 "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #stage { position: fixed; inset: 0; background: #000; display: none; }
  #stage.on { display: block; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
  #wait h1 { font-size: 34px; margin: 0 0 8px; }
  #wait p { color: var(--soft); margin: 4px 0; }
  #tap { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.55);
    color: #fff; font-size: 26px; cursor: pointer; text-align: center; }
  #tap.on { display: grid; }
  #status { position: fixed; left: 16px; bottom: 12px; font-size: 14px; color: #bbb; opacity: .8; }
  #now { font-size: 22px; color: var(--ink); margin: 18px 0 12px; overflow-wrap: anywhere; }
  #watch { font: inherit; font-size: 26px; font-weight: 600; color: #fff; background: var(--accent); border: 0;
    border-radius: 12px; padding: 16px 36px; cursor: pointer; margin: 6px 0 14px; }
  #watch:disabled { opacity: .6; cursor: wait; }
  #watch[hidden] { display: none; }
  #switch { color: var(--accent); }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: none; align-items: center; gap: 14px;
    padding: 28px 24px 14px; background: linear-gradient(transparent, rgba(0,0,0,.75)); color: #fff;
    font-size: 16px; opacity: 0; transition: opacity .25s; }
  #bar.on { display: flex; }
  #bar.shown { opacity: 1; }
  #seek { flex: 1; accent-color: var(--accent); height: 22px; cursor: pointer; }
  #clock { min-width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body data-host="phone">
<div id="wait">
  <div>
    <h1>📺 Totum on this screen</h1>
    <p id="who">⏳ Connecting to Totum</p>
    <p id="now"></p>
    <button id="watch" hidden>▶️ Watch here</button>
    <p id="hint">Or pick this screen in Totum's 🖥️ menu on the phone.</p>
    <p id="switchrow"><a id="switch" href="https://crashlog.333133333.xyz/screen?choose=1">🔀 Switch phone</a></p>
  </div>
</div>
<div id="stage"><video id="video" playsinline></video></div>
<div id="bar"><input id="seek" type="range" min="0" max="0" value="0" step="1" aria-label="Position"><span id="clock">0:00 / 0:00</span></div>
<div id="tap"><div>▶️ Click once to allow sound and full screen</div></div>
<div id="status"></div>
<script>
(() => {
  const key = new URLSearchParams(location.hash.slice(1)).get('key') || '';
  const onPi = document.body.dataset.host === 'pi';
  const brain = onPi ? 'Totum at home' : 'your phone';
  const ua = navigator.userAgent;
  const browserName = ua.includes('Silk/') ? 'Silk' : ua.includes('Edg/') ? 'Edge' : ua.includes('Firefox/') ? 'Firefox'
    : ua.includes('Chrome/') ? 'Chrome' : ua.includes('Safari/') ? 'Safari' : 'browser';
  const name = localStorage.getItem('totumScreenName') || (onPi ? browserName : 'PC (' + browserName + ')');
  const video = document.getElementById('video');
  const stage = document.getElementById('stage');
  const tap = document.getElementById('tap');
  const status = document.getElementById('status');
  let id = localStorage.getItem('totumScreenId') || '';
  let greeted = false;
  let currentLoad = 0;
  let after = 0;
  let unlocked = false;
  let lastError = '';
  let player = null;

  const STOP_SHOWN_AFTER_MS = 1500;
  const say = (text) => { status.textContent = text; };
  const nowEl = document.getElementById('now');
  const watch = document.getElementById('watch');
  function showNow(now) {
    if (onPi) return;
    nowEl.textContent = now
      ? (now.playing ? '▶️ ' : '⏸️ ') + 'On your phone: ' + now.title + (now.by ? ' · ' + now.by : '')
      : '📭 Nothing playing on the phone. Watch here plays the queue’s current item.';
    watch.hidden = !greeted || !!(now && now.here);
    if (now && now.here) { asked = 0; watch.disabled = false; }
  }
  let asked = 0;
  watch.addEventListener('click', async () => {
    unlock();
    watch.disabled = true;
    asked = Date.now();
    say('⏳ Asking ' + brain + ' to play here…');
    try {
      const reply = await api('watch', { id });
      if (reply.ok) {
        say('📱 Your phone is handing over…');
      } else {
        say('⚠️ ' + brain + ' said no (' + reply.status + '); try again');
        watch.disabled = false;
      }
    } catch (e) {
      say('⚠️ Cannot reach ' + brain + ': ' + e.message);
      watch.disabled = false;
    }
  });
  setInterval(() => {
    if (!asked || Date.now() - asked < 20000) return;
    asked = 0;
    watch.disabled = false;
    if (!stage.classList.contains('on')) say('⚠️ Nothing started here: is the queue on your phone empty?');
  }, 1000);
  const api = (path, params) => {
    const q = new URLSearchParams(Object.assign({ key }, params));
    return fetch('/screen/' + path + '?' + q.toString(), { cache: 'no-store' });
  };

  const bar = document.getElementById('bar');
  const seek = document.getElementById('seek');
  const clock = document.getElementById('clock');
  let dragging = false;
  let hideBarTimer = 0;
  const mmss = (seconds) => {
    const s = Math.max(0, Math.floor(seconds || 0));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0');
    return h ? h + ':' + String(m).padStart(2, '0') + ':' + x : m + ':' + x;
  };
  function drawBar() {
    const duration = isFinite(video.duration) ? video.duration : 0;
    if (!dragging) {
      seek.max = Math.round(duration * 1000);
      seek.value = Math.round(video.currentTime * 1000);
    }
    clock.textContent = mmss(Number(seek.value) / 1000) + ' / ' + mmss(duration);
  }
  function showBar() {
    bar.classList.add('shown');
    clearTimeout(hideBarTimer);
    hideBarTimer = setTimeout(() => bar.classList.remove('shown'), 3000);
  }
  document.addEventListener('mousemove', showBar);
  video.addEventListener('timeupdate', drawBar);
  video.addEventListener('durationchange', drawBar);
  seek.addEventListener('input', () => { dragging = true; drawBar(); showBar(); });
  seek.addEventListener('change', async () => {
    dragging = false;
    const pos = Number(seek.value);
    say('⏩ Asking ' + brain + ' to go to ' + mmss(pos / 1000) + '…');
    try {
      const reply = await api('seek', { id, pos });
      if (!reply.ok) say('⚠️ ' + brain + ' refused the seek (' + reply.status + ')');
    } catch (e) {
      say('⚠️ Cannot reach ' + brain + ' to seek: ' + e.message);
    }
  });

  function unlock() {
    unlocked = true;
    tap.classList.remove('on');
    video.muted = false;
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    video.play().catch((e) => { lastError = 'play refused: ' + e.message; });
  }
  tap.addEventListener('click', unlock);

  let stopTimer = 0;
  function showWaiting() {
    stage.classList.remove('on');
    bar.classList.remove('on');
    document.getElementById('wait').style.display = 'grid';
    say('⏹️ Stopped');
  }

  async function load(command) {
    clearTimeout(stopTimer);
    currentLoad = command.load || 0;
    if (!player) {
      shaka.polyfill.installAll();
      player = new shaka.Player();
      await player.attach(video);
      player.addEventListener('error', (e) => { lastError = 'shaka ' + (e.detail && e.detail.code); });
    }
    stage.classList.add('on');
    bar.classList.add('on');
    document.getElementById('wait').style.display = 'none';
    const given = new URL(command.url);
    await player.load(location.origin + given.pathname + given.search, (command.pos || 0) / 1000);
    video.playbackRate = command.rate || 1;
    if (command.subs) player.selectTextLanguage(command.subs), player.setTextTrackVisibility(true);
    else player.setTextTrackVisibility(false);
    if (command.play) start();
    say('▶️ ' + (command.title || 'Playing from Totum'));
  }

  function start() {
    if (!unlocked) tap.classList.add('on');
    video.play().catch((e) => { tap.classList.add('on'); lastError = 'play needs a click: ' + e.message; });
  }

  async function apply(command) {
    switch (command.do) {
      case 'load': return load(command);
      case 'play': return start();
      case 'pause': return video.pause();
      case 'seek': video.currentTime = (command.pos || 0) / 1000; return;
      case 'rate': video.playbackRate = command.rate || 1; return;
      case 'subs':
        if (!player) return;
        if (command.lang) { player.selectTextLanguage(command.lang); player.setTextTrackVisibility(true); }
        else player.setTextTrackVisibility(false);
        return;
      case 'volume': video.volume = Math.min(1, Math.max(0, command.level)); return;
      case 'stop':
        video.pause();
        if (player) await player.unload();
        clearTimeout(stopTimer);
        stopTimer = setTimeout(showWaiting, STOP_SHOWN_AFTER_MS);
        return;
    }
  }

  async function codecs() {
    const probes = {
      AVC: 'video/mp4; codecs="avc1.640028"',
      VP9: 'video/webm; codecs="vp09.00.40.08"',
      HEVC: 'video/mp4; codecs="hvc1.1.6.L120.90"',
      AV1: 'video/mp4; codecs="av01.0.08M.08"',
    };
    const sizes = [[3840, 2160], [2560, 1440], [1920, 1080], [1280, 720]];
    const ok = (window.MediaSource && MediaSource.isTypeSupported) ? MediaSource.isTypeSupported.bind(MediaSource) : () => false;
    const caps = navigator.mediaCapabilities && navigator.mediaCapabilities.decodingInfo;
    const found = [];
    for (const [family, type] of Object.entries(probes)) {
      if (!ok(type)) continue;
      let tallest = 0;
      if (caps) {
        for (const [width, height] of sizes) {
          try {
            const info = await navigator.mediaCapabilities.decodingInfo({
              type: 'media-source',
              video: { contentType: type, width, height, bitrate: 20000000, framerate: 30 },
            });
            if (info.supported) { tallest = height; break; }
          } catch (e) { lastError = 'capabilities ' + family + ': ' + e.message; }
        }
      }
      found.push(tallest ? family + ':' + tallest : family);
    }
    return found.join('+');
  }

  async function hello() {
    const reply = await api('hello', { name, id, codecs: await codecs(), height: screen.height * (window.devicePixelRatio || 1) });
    const body = await reply.json();
    if (!reply.ok) throw new Error(body.error || reply.status);
    id = body.id;
    after = body.after || 0;
    localStorage.setItem('totumScreenId', id);
    greeted = true;
    document.getElementById('who').textContent = '✅ Connected as “' + name + '”';
    if (onPi) {
      watch.hidden = true;
      document.getElementById('now').textContent = '';
      document.getElementById('hint').textContent = 'In Totum, choose ▶️ Play on, then “' + name + '”.';
      document.getElementById('switchrow').hidden = true;
    }
    showNow(body.now);
  }

  async function pollForever() {
    for (;;) {
      try {
        if (!greeted) await hello();
        const reply = await api('poll', { id, after });
        if (reply.status === 400) { greeted = false; continue; }
        for (const item of await reply.json()) {
          after = Math.max(after, item.n);
          try { await apply(item.command); } catch (e) { lastError = item.command.do + ': ' + e.message; }
        }
      } catch (e) {
        document.getElementById('who').textContent = '⚠️ Cannot reach ' + brain + '; trying again…';
        greeted = false;
        await new Promise((r) => setTimeout(r, 3000));
      }
    }
  }

  setInterval(() => {
    if (!id) return;
    const buffering = !video.paused && video.readyState < 3;
    api('state', {
      id,
      pos: Math.round(video.currentTime * 1000),
      load: currentLoad,
      playing: !video.paused && !video.ended ? 1 : 0,
      buffering: buffering ? 1 : 0,
      ended: video.ended ? 1 : 0,
      error: lastError,
    }).then((reply) => reply.ok ? reply.json() : null).then((body) => { if (body) showNow(body.now); }).catch(() => {});
    lastError = '';
  }, 1000);

  pollForever();
})();
</script>
</body>
</html>
