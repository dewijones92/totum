name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A hand-startable run, because a push event is not guaranteed to produce one.
  #
  # GitHub Actions had a major outage on 2026-08-06 (15:22 UTC). Five pushes to main landed during
  # it and NO run was ever created for any of them — and when Actions came back it did not backfill
  # them, so those commits would have gone unverified and unreleased for good. With only `push` as
  # a trigger the sole recovery is an empty commit, which is a lie in the history about what
  # changed. This makes the recovery honest: re-run the tip from the Actions tab, or
  # `gh workflow run ci.yml --ref main`.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-sponsorblock:
    name: SponsorBlock removal (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg + yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m pip install "yt-dlp==2026.6.9"
      - name: Verify SponsorBlock segments are cut from downloads
        run: python3 tools/sponsorblock-verify/verify_sponsorblock_cut.py

  verify-mock-youtube:
    name: Mock YouTube replay (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install yt-dlp + mitmproxy (pinned to the cassette's recording versions)
        run: python3 -m pip install "yt-dlp==2026.6.9" "mitmproxy==12.2.2"
      - name: Replay cassette and verify offline extraction
        run: tools/mock-youtube/verify_replay.sh

  # The 46 instrumented tests were COMPILED by the gate and never run — no emulator existed
  # here. That is the gap that let three autoplay bugs ship in one week: each passed the JVM
  # suite because every component was correct against its fake, and only a real player reaching
  # the real end of real media exercises the composition where all three lived. A guard that
  # only runs when someone remembers to run it is not a guard.
  #
  # Deliberately its own job, and deliberately NOT a dependency of the release. An emulator is
  # the flakiest thing in any Android pipeline, and Dewi installs from these releases through
  # Obtainium — blocking his APK on a flaky VM would trade a real problem for a worse one. It
  # goes red and is seen; it does not stop a build shipping.
  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Without KVM the emulator falls back to software rendering and is far too slow to finish.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        env:
          WG_CI_CONF: ${{ secrets.WG_CI_CONF }}
          WG_EXPECTED_EGRESS_IP: ${{ secrets.WG_EXPECTED_EGRESS_IP }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # The loop test needs audio focus, which the platform refuses to a background app or a
          # locked screen — and a suppressed player never ends, so the test would measure nothing
          # while appearing to run. `stayon true` matters as much as the unlock: the build takes
          # minutes, and a screen that slept in the meantime puts the device right back in the
          # state the unlock was there to avoid. Animations off so Compose's idling resource is
          # not waiting on them.
          script: |
            adb shell input keyevent 82
            adb shell svc power stayon true
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            ./gradlew connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.notClass=com.dewijones92.totum.sabr.SabrPlaybackTest,com.dewijones92.totum.playback.LiveDownloadedVideoOfflineTest,com.dewijones92.totum.playback.LiveSabrDownloadTest,com.dewijones92.totum.playback.LiveStreamPlaysToItsEndTest,com.dewijones92.totum.video.live.DurableUrlsOnDeviceTest
            tools/ci/live-test-via-home.sh


      # Always, not just on failure: a PASS that was really a skip looks identical otherwise,
      # and this suite's whole value is being believed about what it did.
      - name: Summarise instrumented tests
        if: always()
        run: |
          python3 tools/ci/test-summary.py "Instrumented tests (emulator)" \
            app/build/outputs/androidTest-results core/database/build/outputs/androidTest-results \
            core/playback/build/outputs/androidTest-results

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**

  build:
    name: Quality gates + build
    runs-on: ubuntu-latest
    permissions:
      contents: write # rolling 'latest' release
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-daemon

      - name: Android Lint
        run: ./gradlew lint --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      # Reads the JUnit XML the tasks above already wrote and puts a table on the run page —
      # every failure named, with its message, plus annotations. `if: always()` because the
      # summary is worth most when something failed. See tools/ci/test-summary.py.
      - name: Summarise unit tests
        if: always()
        run: |
          python3 tools/ci/test_summary_test.py
          python3 tools/ci/youtube_canary_test.py
          python3 tools/ci/test-summary.py "Unit tests" \
            $(ls -d */build/test-results */*/build/test-results 2>/dev/null)

      - name: Coverage gate (logic modules)
        run: ./gradlew koverVerify --no-daemon

      # Instrumented tests need a device to RUN, but they compile without one — and until
      # 2026-08-01 nothing compiled them at all, so AppShellTest sat red for an unknown time
      # asserting a string the app had stopped showing. A test that cannot compile is worse
      # than absent: it looks like coverage.
      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: totum-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # ---- Rolling signed release of main's tip (for Obtainium) ----

      - name: Decode signing keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/totum-release.jks"

      - name: Assemble signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/totum-release.jks
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # Baked in so torrents need no setup on a fresh install. A secret rather than a
          # literal because this repo is public; absent, the build still succeeds and the app
          # simply asks for a server as it did before.
          TOTUM_HOME_SERVER: ${{ secrets.TOTUM_HOME_SERVER }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=$((100 + GITHUB_RUN_NUMBER)) \
            -PversionName="0.1.${GITHUB_RUN_NUMBER}" \
            -PgitSha="${GITHUB_SHA:0:7}"

      # The desktop half of the same build. One release carries both, so the CLI and the APK
      # from a given version are provably the same code — which is the point of it living in
      # this repo rather than beside it.
      - name: Build the command-line tool
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ./gradlew :cli:installDist --no-daemon -PversionName="0.1.${GITHUB_RUN_NUMBER}"
          # The installer travels INSIDE the archive as well as beside it, so an already-installed
          # copy can upgrade itself without going back to the internet for a script.
          cp tools/cli/install.sh cli/build/install/totum/install.sh
          tar -czf totum-cli.tar.gz -C cli/build/install totum
          sha256sum totum-cli.tar.gz > totum-cli.tar.gz.sha256
          cp tools/cli/install.sh install.sh

      # A real tag per build, not a rolling one. Obtainium's default version string for a
      # GitHub source is the release TAG, so a permanently-fixed `latest` meant the
      # version never appeared to change and an update was only ever detected by
      # non-default settings. v0.1.<run> matches versionName exactly, so the tag, the
      # release title and the installed app all agree.
      - name: Publish versioned release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk totum.apk
          # Ship the R8 mapping with the build it belongs to: without it, a crash report
          # from this APK is a wall of one-letter class names (the trace carries a map id
          # to match against). Costs nothing and is useless if fetched later.
          cp app/build/outputs/mapping/release/mapping.txt totum-mapping.txt || true
          # Not a prerelease: it makes this the repo's "Latest release", so
          # /releases/latest/download/totum.apk stays a stable URL without a rolling tag,
          # and Obtainium needs nothing switched on to see it.
          {
            echo "Build of main at ${GITHUB_SHA}. Signed; safe to update over previous builds."
            echo
            echo "**Android** - \`totum.apk\`, or add this repo to Obtainium."
            echo
            echo "**Linux / macOS command line** - one line, no sudo, nothing outside \$HOME:"
            echo
            echo '```'
            echo "curl -fsSL https://github.com/dewijones92/totum/releases/latest/download/install.sh | sh"
            echo '```'
            echo
            echo "It verifies the checksum, installs to \`~/.local/share/totum-cli\`, links \`~/.local/bin/totum\`,"
            echo "and then runs \`totum doctor\` to tell you the exact command for anything missing."
            echo
            echo "Then: \`totum \"jazz live stream\"\`"
            echo
            echo "Needs Java 17+, \`python3\` with \`yt-dlp\`, and a player (\`mpv\`, \`vlc\` or \`ffplay\`)."
            echo "\`totum doctor\` checks all of it. The raw archive is \`totum-cli.tar.gz\` if you prefer."
          } > release-notes.md
          gh release create "v0.1.${GITHUB_RUN_NUMBER}" \
            totum.apk totum-mapping.txt totum-cli.tar.gz totum-cli.tar.gz.sha256 install.sh \
            --target "${GITHUB_SHA}" \
            --title "Totum main tip (0.1.${GITHUB_RUN_NUMBER})" \
            --notes-file release-notes.md

      # Always, not only on failure: a passing run's HTML report is what answers "how long does
      # this take now" and "did that flaky one skip", and downloading it later is impossible.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            build/reports/
